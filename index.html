<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn Scheduler</title>
<style>
:root{
  --bg:#ffffff; --side:#f7f7f8; --canvas:#f4f4f5; --card:#ffffff; --text:#18181b; --muted:#71717a; --faint:#a1a1aa;
  --line:#e4e4e7; --hover:#efeff1; --sel:#e8f0fb; --accent:#0a66c2; --accent-ink:#fff; --accent-soft:#e8f0fb;
  --ok:#15803d; --warn:#b45309; --bad:#dc2626; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121214; --side:#18181b; --canvas:#0e0e10; --card:#1c1c1f; --text:#f4f4f5; --muted:#a1a1aa; --faint:#71717a;
    --line:#2c2c31; --hover:#232327; --sel:#1b2a3d; --accent:#4a9be6; --accent-ink:#06121f; --accent-soft:#16283c;
    --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:300px 1fr;height:100vh}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px}
.brand .mark{width:24px;height:24px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand .mark svg{width:14px;height:14px;stroke-width:2.4}
.iconbtn{border:0;background:none;width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.me{display:flex;align-items:center;gap:10px;padding:6px 14px 12px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:650;font-size:13px;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:48px;height:48px;font-size:17px}
.me .name{font-weight:600;font-size:13.5px;line-height:1.2}
.me .sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)} .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);margin:0 12px;background:var(--hover);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:5px 0;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .n{font-size:11px;color:var(--faint);margin-left:3px}
.seg .n.bad{color:var(--bad);font-weight:700}
.search{margin:10px 12px 4px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px 6px 30px;font-size:13px}
.search svg{position:absolute;left:9px;top:8px;color:var(--faint);width:14px;height:14px}
.newbtn{display:flex;align-items:center;gap:8px;margin:4px 8px;padding:8px 8px;border:0;background:none;border-radius:8px;color:var(--muted);font-size:13.5px;text-align:left}
.newbtn:hover{background:var(--hover);color:var(--text)}
.list{flex:1;overflow-y:auto;padding:0 0 16px}
.group{font-size:11.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;padding:14px 16px 4px}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px 10px 13px;border-left:3px solid transparent;border-bottom:1px solid var(--line)}
.item:hover{background:var(--hover)}
.item.sel{background:var(--sel);border-left-color:var(--accent)}
.item .t{font-size:13.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.item .meta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:var(--muted)}
.item .meta svg{width:13px;height:13px}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--hover)}
.tag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.tag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.tag.acc{color:var(--accent);background:var(--accent-soft)}
.empty{padding:28px 18px;color:var(--muted);font-size:13px;text-align:center}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);min-height:54px;flex-wrap:wrap}
.state{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.state b{color:var(--text);font-weight:600}
.tools{display:flex;align-items:center;gap:6px;position:relative}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)} .btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px}
.scroll{flex:1;overflow-y:auto;padding:28px 16px 80px}
.col{max-width:600px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.post-head{display:flex;gap:10px;padding:16px 16px 6px}
.post-head .who{min-width:0}
.post-head .nm{font-weight:600;font-size:14px;line-height:1.25}
.post-head .hl{font-size:12px;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:470px}
.post-head .tm{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.post-head .tm svg{width:12px;height:12px}
.editor{display:block;width:100%;border:0;background:none;resize:none;outline:none;padding:6px 16px 10px;font-size:14.5px;line-height:1.55;min-height:180px;overflow:hidden}
.editor::placeholder{color:var(--faint)}
.rendered{padding:6px 16px 10px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.rendered .ht{color:var(--accent);font-weight:600}
.seemore{border:0;background:none;color:var(--muted);padding:0;font-weight:600}
.hook{margin:0 16px 10px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:12.5px;color:var(--text)}
.hook b{color:var(--accent)}
.toolbar{display:flex;align-items:center;gap:2px;padding:6px 10px;border-top:1px solid var(--line)}
.toolbar .sp{flex:1}
.count{font-size:12px;color:var(--faint);padding-right:6px}
.count.over{color:var(--bad);font-weight:700}
.linkrow{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line)}
.linkrow input{flex:1}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13.5px}
textarea.field{resize:vertical;min-height:70px;line-height:1.5}
.media{padding:0 16px 12px}
.grid{display:grid;gap:4px;border-radius:8px;overflow:hidden}
.grid.n1{grid-template-columns:1fr} .grid.n2{grid-template-columns:1fr 1fr} .grid.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.grid.n3 .tile:first-child{grid-row:span 2} .grid.n4{grid-template-columns:1fr 1fr}
.tile{position:relative;background:var(--hover);min-height:120px;aspect-ratio:1.2/1}
.grid.n1 .tile{aspect-ratio:auto;min-height:160px}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.grid.n1 .tile img{max-height:520px;object-fit:contain;background:var(--hover)}
.tile .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.tile .x svg{width:13px;height:13px;stroke-width:2.4}
.tile .more{position:absolute;inset:0;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700}
.filecard{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:8px;position:relative}
.filecard .ic{width:40px;height:40px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.filecard .ic svg{width:20px;height:20px}
.filecard .x{position:static;background:var(--hover);color:var(--text);margin-left:auto}
.filecard .grow{flex:1;min-width:0}
.filecard .fn{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alts{margin-top:8px}
.alts summary{font-size:12px;color:var(--muted);cursor:pointer}
.alts input{margin-top:6px}
.drop{outline:2px dashed var(--accent);outline-offset:-6px}

.plug{margin-top:16px;padding:14px 16px}
.plug-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plug-h .ttl{display:flex;align-items:center;gap:8px;font-weight:600}
.plug-h .ttl svg{color:var(--accent)}
.plug .body{margin-top:12px;display:grid;gap:10px}
.plug label.l{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.plug .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plug .final{font-size:12.5px;background:var(--hover);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-all;color:var(--muted)}
.plug .final b{color:var(--text)}
.switch{position:relative;width:34px;height:20px;border-radius:99px;background:var(--line);border:0;flex:none;transition:.15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)} .switch.on::after{left:16px}
.note{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:12.5px;white-space:pre-wrap;word-break:break-word}

/* popover, modal, toast */
.pop{position:absolute;right:0;top:40px;width:300px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:12px;z-index:20;display:grid;gap:8px}
.pop .opt{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:8px;padding:8px;text-align:left}
.pop .opt:hover{background:var(--hover)}
.pop .opt .k{font-weight:600;font-size:13px}
.pop .opt .v{font-size:12px;color:var(--muted)}
.pop hr{border:0;border-top:1px solid var(--line);margin:2px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:14px;width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:16px}
.modal .mb{padding:16px 18px;overflow-y:auto;display:grid;gap:14px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.modal h3{margin:6px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
.modal label.l{font-size:12.5px;font-weight:600;display:block;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip button{border:0;background:none;padding:0;color:inherit;display:grid}
.chip svg{width:12px;height:12px}
.radio{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--faint);text-transform:uppercase}
td .snip{max-width:300px;max-height:3.2em;overflow:hidden;white-space:pre-wrap}
td input[type=file]{font-size:11.5px;max-width:170px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:min(560px,calc(100vw - 32px));white-space:pre-wrap}
.toast.bad{background:var(--bad);color:#fff}
.welcome{max-width:460px;margin:12vh auto 0;text-align:center}
.welcome h2{font-size:20px;margin:12px 0 6px}
.welcome p{color:var(--muted);margin:0 0 18px}
.hidden{display:none!important}
.back{display:none}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .app.post-open .side{display:none}
  .app:not(.post-open) .main{display:none}
  .back{display:inline-grid}
  .plug .row2,.grid2{grid-template-columns:1fr}
  .scroll{padding:16px 12px 80px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="side-top">
      <div class="brand"><span class="mark"><svg viewBox="0 0 24 24"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg></span>Scheduler</div>
      <div>
        <button class="iconbtn" id="bulkBtn" title="Bulk add posts"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><path d="M19 15v6M16 18h6"/></svg></button>
        <button class="iconbtn" id="settingsBtn" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </div>
    <div class="me">
      <div class="avatar" id="meAvatar"></div>
      <div style="min-width:0">
        <div class="name" id="meName">Your name</div>
        <div class="sub"><span class="dot" id="connDot"></span><span id="connText">Not connected</span></div>
      </div>
    </div>
    <div class="seg" id="seg">
      <button data-tab="drafts">Drafts<span class="n" id="nDrafts"></span></button>
      <button data-tab="queue">Queue<span class="n" id="nQueue"></span></button>
      <button data-tab="posted">Posted</button>
    </div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" placeholder="Search posts"></div>
    <button class="newbtn" id="newBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New draft <span style="margin-left:auto"><kbd>N</kbd></span></button>
    <div class="list" id="list"></div>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <div class="state">
        <button class="iconbtn back" id="backBtn" title="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <span id="state"></span>
      </div>
      <div class="tools" id="tools"></div>
    </div>
    <div class="scroll" id="scroll"></div>
  </main>
</div>

<input type="file" id="fImages" accept="image/jpeg,image/png,image/gif" multiple hidden>
<input type="file" id="fVideo" accept="video/*" hidden>
<input type="file" id="fDoc" accept=".pdf,.ppt,.pptx,.doc,.docx" hidden>
<input type="file" id="fAvatar" accept="image/*" hidden>

<script>
/* =========================================================================
   LinkedIn Scheduler: a local app. Your posts live in your GitHub repo;
   GitHub Actions publishes them. Nothing is sent anywhere else.
   ========================================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const IMG = ['jpg','jpeg','png','gif'], VID = ['mp4','mov','m4v','avi','wmv','webm','mkv','flv'], DOC = ['pdf','ppt','pptx','doc','docx'];
const MAX_TEXT = 3000, MAX_COMMENT = 1250, MAX_FILE = 95e6, HOOK = 210;
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WORKFLOW = 'linkedin-scheduler.yml';
const DEFAULT_SETTINGS = {
  profile: { name: '', headline: '', avatar: '' },
  slots: { days: [1,2,3,4,5], times: ['09:30'] },
  jitter: 10,
  plug: { text: '', link: '', delay_hours: 2 },
};
const I = {
  image: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>',
  video: '<svg viewBox="0 0 24 24"><rect x="2" y="5" width="14" height="14" rx="3"/><path d="m16 10 6-3v10l-6-3"/></svg>',
  doc: '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  link: '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
  eye: '<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  chat: '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  send: '<svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  ext: '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',

  bolt: '<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',

const S = {
  cfg: {}, settings: structuredClone(DEFAULT_SETTINGS), posts: new Map(),
  tab: 'drafts', search: '', cur: null, connected: false, media: new Map(),

/* ---------------- small utils ---------------- */
function load(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } }
function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
let toastT;
function toast(text, bad = false, ms = 3500){
  document.querySelector('.toast')?.remove(); clearTimeout(toastT);
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = text;
  document.body.appendChild(t); toastT = setTimeout(() => t.remove(), bad ? 7000 : ms);
}
function extType(name){ const e = (name.split('.').pop() || '').toLowerCase(); return IMG.includes(e) ? 'image' : VID.includes(e) ? 'video' : DOC.includes(e) ? 'document' : null; }
function textToB64(t){ const b = new TextEncoder().encode(t); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToText(b64){ const bin = atob(b64.replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function fileToB64(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); }); }
function safeName(n){ return n.replace(/[^\w.\-]+/g, '_').slice(-60); }
function newId(){ const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${Math.random().toString(36).slice(2,5)}`; }
function iso(d){ return d.toISOString().replace(/\.\d{3}Z$/, 'Z'); }
function toLocalInput(d){ const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function fmtTime(d){ return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }
function fmtDay(d){
  const t = new Date(); t.setHours(0,0,0,0); const x = new Date(d); x.setHours(0,0,0,0);
  const diff = Math.round((x - t) / 864e5);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow'; if (diff === -1) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtWhen(d){ return `${fmtDay(d)}, ${fmtTime(d)}`; }
function initials(n){ return (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?'; }
function avatarHTML(){ const p = S.settings.profile; return p.avatar ? `<img src="${esc(p.avatar)}" alt="">` : esc(initials(p.name)); }
function firstLine(t){ return (t || '').trim().split('\n')[0]; }
function addUtm(link, id){
  if (!link) return '';
  try {
    const u = new URL(/^https?:\/\//.test(link) ? link : 'https://' + link);
    const set = (k, v) => { if (!u.searchParams.has(k)) u.searchParams.set(k, v); };
    set('utm_source', 'linkedin'); set('utm_medium', 'social'); set('utm_campaign', `post-${id}`); set('utm_content', 'plug');
    return u.toString();
  } catch { return link; }
}
function plugFinal(plug, id){
  const link = addUtm((plug.link || '').trim(), id || '<post-id>');
  let t = (plug.text || '').trim();
  if (link) t = t.includes('{link}') ? t.replace('{link}', link) : (t + '\n' + link).trim();
  return t;
}

/* ---------------- GitHub ---------------- */
async function gh(path, opts = {}){
  const { owner, repo, token } = S.cfg;
  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}${path}`, {
    method: opts.method || 'GET',
    cache: 'no-store', // GitHub's API is cacheable for 60s; a stale branch head causes "not a fast forward"
    headers: { Authorization: `Bearer ${token}`, Accept: opts.accept || 'application/vnd.github+json', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) { let m = ''; try { m = (await res.json()).message; } catch {} const e = new Error(`GitHub ${res.status}: ${m || res.statusText}`); e.status = res.status; throw e; }
  if (opts.raw) return res;
  return res.status === 204 || res.status === 201 && !res.headers.get('content-length') ? null : res.json().catch(() => null);
}
async function commitChanges(changes, message){
  const br = S.cfg.branch;
  for (const c of changes) if (!c.del && !c.sha) c.sha = (await gh('/git/blobs', { method: 'POST', body: { content: c.b64, encoding: 'base64' } })).sha;
  for (let attempt = 0; attempt < 6; attempt++) {
    const head = (await gh(`/git/ref/heads/${br}?t=${Date.now()}`)).object.sha;
    const base = (await gh(`/git/commits/${head}`)).tree.sha;
    const tree = await gh('/git/trees', { method: 'POST', body: { base_tree: base, tree: changes.map(c => ({ path: c.path, mode: '100644', type: 'blob', sha: c.del ? null : c.sha })) } });
    const commit = await gh('/git/commits', { method: 'POST', body: { message, tree: tree.sha, parents: [head] } });
    try { await gh(`/git/refs/heads/${br}`, { method: 'PATCH', body: { sha: commit.sha, force: false } }); return; }
    catch (e) { if (e.status !== 422 || attempt === 5) throw e; await sleep(1000 * (attempt + 1)); }
  }
}
async function exists(path){ try { await gh(`/contents/${path}?ref=${S.cfg.branch}`); return true; } catch (e) { if (e.status === 404) return false; throw e; } }
async function dispatch(action, postId = ''){
  await gh(`/actions/workflows/${WORKFLOW}/dispatches`, { method: 'POST', body: { ref: S.cfg.branch, inputs: { action, post_id: postId } } });
}
async function mediaURL(path){
  if (S.media.has(path)) return S.media.get(path);
  const enc = path.split('/').map(encodeURIComponent).join('/');
  const res = await gh(`/contents/${enc}?ref=${S.cfg.branch}`, { accept: 'application/vnd.github.raw', raw: true });
  const u = URL.createObjectURL(await res.blob()); S.media.set(path, u); return u;
}

/* ---------------- loading ---------------- */
async function connect(){
  renderMe();
  if (!S.cfg.owner || !S.cfg.repo || !S.cfg.token) {
    const missing = [!S.cfg.owner && 'GitHub owner', !S.cfg.repo && 'Repository', !S.cfg.token && 'GitHub token'].filter(Boolean);
    S.connected = false; S.connErr = (S.cfg.owner || S.cfg.repo || S.cfg.token) ? `Missing: ${missing.join(', ')}. Fill ${missing.length > 1 ? 'them' : 'it'} in under Settings → GitHub connection.` : null;
    renderAll(); return;
  }
  try {
    await gh(`/git/ref/heads/${S.cfg.branch}`);
    S.connected = true; S.connErr = null; renderMe(); await loadAll();
  } catch (e) { S.connected = false; S.connErr = explainConnErr(e); renderMe(); renderAll(); toast(S.connErr, true); }
}
function explainConnErr(e){
  const m = String(e && e.message || e);
  if (e instanceof TypeError || /failed to fetch|load failed|networkerror/i.test(m))
    return 'Your browser blocked the connection to GitHub from a local file.\nOpen scheduler.html in Google Chrome (right-click the file → Open With → Google Chrome).';
  if (e.status === 401) return 'GitHub rejected the token (401). Paste the github_pat_… token again, with no spaces.';
  if (e.status === 404) return `GitHub can't find ${S.cfg.owner}/${S.cfg.repo} with this token (404). Check owner = rklokesh-studio and repo = linkedin-scheduler.`;
  if (e.status === 403) return 'GitHub refused access (403). The token may be missing Contents permission or awaiting organization approval.';
  return 'Could not connect: ' + m;
}
function normalizeCfg(c){
  // accept a pasted repo URL or "owner/repo" in the owner field
  const m = (c.owner || '').trim().match(/(?:github\.com\/)?([\w.-]+)\/([\w.-]+)/);
  if (m) { c.owner = m[1]; c.repo = m[2]; }
  c.owner = (c.owner || '').replace(/^@/, '').trim(); c.repo = (c.repo || '').replace(/\.git$/, '').trim();
  c.token = (c.token || '').replace(/\s+/g, ''); c.branch = (c.branch || 'main').trim() || 'main';
  return c;
}
async function loadAll(){
  const tree = (await gh(`/git/trees/${S.cfg.branch}?recursive=1`)).tree.filter(t => t.type === 'blob');
  const read = async t => JSON.parse(b64ToText((await gh(`/git/blobs/${t.sha}`)).content));
  const pick = re => tree.filter(t => re.test(t.path));
  const settingsT = tree.find(t => t.path === 'config/settings.json');
  if (settingsT) { S.settings = deepMerge(structuredClone(DEFAULT_SETTINGS), await read(settingsT)); store('lis-settings', S.settings); }
  const posted = pick(/^posted\/[^/]+\/[^/]+\.json$/).sort((a, b) => b.path.split('/').pop().localeCompare(a.path.split('/').pop())).slice(0, 80);
  const groups = [['drafts', pick(/^drafts\/[^/]+\.json$/)], ['queue', pick(/^queue\/[^/]+\.json$/)], ['posted', posted]];
  const posts = new Map();
  for (const [folder, items] of groups) {
    const data = await pMap(items, read);
    data.forEach((p, i) => { if (p && p.id) posts.set(p.id, { ...p, _folder: folder, _path: items[i].path }); });
  }
  // keep the open, unsaved post in sync
  S.posts = posts;
  if (S.cur?.id && posts.has(S.cur.id) && !S.cur.dirty) openPost(S.cur.id, true);
  else if (S.cur?.id && !posts.has(S.cur.id) && !S.cur.dirty) S.cur = null;
  renderAll();
}
async function pMap(items, fn, n = 8){ const out = []; let i = 0; await Promise.all(Array.from({ length: n }, async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k]); } })); return out; }
function deepMerge(a, b){ for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') deepMerge(a[k], b[k]); else a[k] = b[k]; } return a; }

/* ---------------- sidebar ---------------- */
function renderMe(){
  const p = S.settings.profile;
  $('#meAvatar').innerHTML = avatarHTML();
  $('#meName').textContent = p.name || 'Set up your profile';
  $('#connDot').className = 'dot ' + (S.connected ? 'ok' : 'bad');
  $('#connText').textContent = S.connected ? `${S.cfg.owner}/${S.cfg.repo}` : 'Not connected';
}
function postsIn(folder){ return [...S.posts.values()].filter(p => p._folder === folder); }
function renderSidebar(){
  const drafts = postsIn('drafts'), queue = postsIn('queue');
  const problems = queue.filter(p => p.status !== 'pending').length;
  $('#nDrafts').textContent = drafts.length || '';
  const nq = $('#nQueue'); nq.innerHTML = (queue.length || '') + (problems ? ` <span class="dot bad" title="${problems} need attention" style="display:inline-block;vertical-align:1px"></span>` : ''); nq.className = 'n';
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const q = S.search.toLowerCase();
  let items = postsIn(S.tab).filter(p => !q || (p.text || '').toLowerCase().includes(q));
  if (S.tab === 'drafts') items.sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''));
  if (S.tab === 'queue') items.sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));
  if (S.tab === 'posted') items.sort((a, b) => (b.posted_at || '').localeCompare(a.posted_at || ''));
  const list = $('#list');
  if (!S.connected) { list.innerHTML = `<div class="empty">Connect your GitHub repo in Settings to load your posts.</div>`; return; }
  if (!items.length) { list.innerHTML = `<div class="empty">${q ? 'No matches.' : { drafts: 'No drafts. Start one with “New draft”.', queue: 'Nothing scheduled yet.', posted: 'Nothing posted yet.' }[S.tab]}</div>`; return; }
  let html = '', lastGroup = '';
  for (const p of items) {
    if (S.tab === 'queue') { const g = fmtDay(new Date(p.scheduled_at)); if (g !== lastGroup) { html += `<div class="group">${esc(g)}</div>`; lastGroup = g; } }
    html += itemHTML(p);
  }
  list.innerHTML = html;
}
function itemHTML(p){
  const meta = [];
  if (p._folder === 'queue') meta.push(`${I.clock}<span>${esc(fmtTime(new Date(p.scheduled_at)))}</span>`);
  if (p._folder === 'posted' && p.posted_at) meta.push(`<span>${esc(fmtWhen(new Date(p.posted_at)))}</span>`);
  if (p._folder === 'drafts' && p.updated_at) meta.push(`<span>Edited ${esc(fmtDay(new Date(p.updated_at)).toLowerCase())}</span>`);
  if (p.media_type && p.media_type !== 'none') meta.push({ image: I.image, video: I.video, document: I.doc }[p.media_type] || '');
  if (p.plug && (p.plug.text || p.plug.link)) {
    const st = p.plug.status;
    meta.push(st === 'posted' ? `<span class="tag ok">plugged</span>` : st === 'failed' ? `<span class="tag bad">plug failed</span>` : `<span title="Has a plug comment">${I.chat}</span>`);
  }
  if (p._folder === 'queue' && p.status !== 'pending') meta.push(`<span class="tag bad">${esc(p.status)}</span>`);
  const sel = S.cur && S.cur.id === p.id ? ' sel' : '';
  return `<button class="item${sel}" data-id="${esc(p.id)}"><div class="t">${esc((p.text || '').trim() || 'Empty draft')}</div><div class="meta">${meta.join('')}</div></button>`;
}

/* ---------------- editor state ---------------- */
function blankPlug(){ const d = S.settings.plug; const on = !!(d.text || d.link); return { enabled: on, text: d.text, link: d.link, delay_hours: d.delay_hours, extra: {} }; }
function plugFromPost(p){
  if (!p.plug) return { enabled: false, text: S.settings.plug.text, link: S.settings.plug.link, delay_hours: S.settings.plug.delay_hours, extra: {} };
  const { text, link, delay_hours, ...extra } = p.plug;
  return { enabled: true, text: text || '', link: link || '', delay_hours: delay_hours ?? null, extra };
}
function newDraft(){
  if (!S.connected) { openSettings(); return; }
  S.cur = { id: null, folder: null, text: '', visibility: 'PUBLIC', items: [], media_title: '', plug: blankPlug(), removed: [], mediaChanged: false, ver: 0, dirty: false, saving: false };
  S.preview = false; S.tab = 'drafts';
  renderAll(); $('#app').classList.add('post-open'); setTimeout(() => $('#editor')?.focus(), 30);
}
function openPost(id, keepView){
  const p = S.posts.get(id); if (!p) return;
  S.cur = {
    id, folder: p._folder, text: p.text || '', visibility: p.visibility || 'PUBLIC', media_title: p.media_title || '',
    items: (p.media || []).map(m => ({ kind: m.path ? 'repo' : 'link', path: m.path, url: m.url, alt: m.alt || '', type: p.media_type, name: (m.path || m.url || '').split('/').pop() })),
    plug: plugFromPost(p), removed: [], mediaChanged: false, ver: 0, dirty: false, saving: false,
  };
  if (!keepView) { S.preview = p._folder === 'posted'; S.expanded = false; }
  renderAll(); $('#app').classList.add('post-open');
}
function curPost(){ return S.cur?.id ? S.posts.get(S.cur.id) : null; }
function readonly(){ return S.cur?.folder === 'posted'; }
function itemsType(items){ return items.length ? items[0].type : 'none'; }

function edited(){
  const c = S.cur; if (!c) return;
  c.ver++; c.dirty = true; renderState();
  clearTimeout(S.timer);
  S.timer = setTimeout(() => autosave(c), 1800);
}
function autosave(c){
  if (!c.dirty || S.cur !== c && !c.dirty) return;
  if (!c.text.trim() && !c.items.length) return;
  if (c.folder === 'queue' && validate(c, true)) return renderState(); // don't save an invalid queued post
  save(c, c.folder || 'drafts').catch(() => {});
}
function save(c, folder, over = {}, message){
  c.saving = true; renderState();
  const run = S.chain.then(() => persist(c, folder, over, message));
  S.chain = run.catch(() => {});
  return run.then(r => { c.saving = false; renderState(); return r; }, e => { c.saving = false; renderState(); toast(e.message, true); throw e; });
}
async function persist(c, folder, over, message){
  const startVer = c.ver;
  const id = c.id || newId();
  const prev = c.id ? S.posts.get(c.id) : null;
  if (prev && prev._folder === 'queue' && !(await exists(prev._path)))
    throw new Error('This post was just published (or removed) by the scheduler. Refresh to see it.');
  const changes = [], media = [];
  for (const [i, it] of c.items.entries()) {
    if (it.kind === 'new') {
      const path = `media/${id}/${Date.now().toString(36)}${i}-${safeName(it.name)}`;
      changes.push({ path, b64: await fileToB64(it.file) });
      S.media.set(path, it.url); it.kind = 'repo'; it.path = path; delete it.file;
    }
    media.push(it.kind === 'repo' ? { path: it.path, alt: it.alt || undefined } : { url: it.url, alt: it.alt || undefined });
  }
  for (const p of c.removed) changes.push({ path: p, del: true });
  const base = prev ? Object.fromEntries(Object.entries(prev).filter(([k]) => !k.startsWith('_'))) : {};
  const post = { ...base, id, text: c.text, visibility: c.visibility, media_type: media.length ? itemsType(c.items) : 'none',
                 media, media_title: c.media_title || undefined, updated_at: iso(new Date()), ...over };
  if (c.mediaChanged) post.uploaded = {};
  // plug
  if (c.plug.enabled && (c.plug.text.trim() || c.plug.link.trim())) {
    const pl = { ...c.plug.extra, text: c.plug.text, link: c.plug.link, delay_hours: c.plug.delay_hours };
    if (folder === 'posted') {
      if (!pl.status || pl.status === 'failed') { pl.status = 'waiting'; pl.attempts = 0; pl.error = null; }
      if (pl.status === 'waiting') {
        if (pl.delay_hours != null && post.posted_at) pl.due_at = iso(new Date(new Date(post.posted_at).getTime() + pl.delay_hours * 36e5));
        else delete pl.due_at;
      }
    }
    post.plug = pl;
  } else if (!(c.plug.extra && c.plug.extra.status === 'posted')) delete post.plug;
  if (folder === 'queue') { post.status = 'pending'; post.attempts = 0; post.error = null; }
  if (folder === 'drafts') { post.status = 'draft'; delete post.scheduled_at; }
  const path = folder === 'posted' ? prev._path : `${folder}/${id}.json`;
  if (prev && prev._path !== path) changes.push({ path: prev._path, del: true });
  changes.push({ path, b64: textToB64(JSON.stringify(post, null, 2) + '\n') });
  await commitChanges(changes, message || `${folder === 'drafts' ? 'Save draft' : 'Update'} ${id}`);
  c.removed = []; c.mediaChanged = false; c.id = id; c.folder = folder;
  if (post.plug) { const { text, link, delay_hours, ...extra } = post.plug; c.plug.extra = extra; }
  if (c.ver === startVer) c.dirty = false;
  S.posts.set(id, { ...post, _folder: folder, _path: path });
  renderSidebar();
  return post;
}

function validate(c, forQueue){
  if (!c.text.trim() && forQueue) return 'Write something first.';
  if (c.text.length > MAX_TEXT) return `LinkedIn allows ${MAX_TEXT} characters. This post has ${c.text.length}.`;
  if (c.plug.enabled) {
    const f = plugFinal(c.plug, c.id || 'x'.repeat(24));
    if (f.length > MAX_COMMENT) return `The plug comment is ${f.length} characters (max ${MAX_COMMENT}).`;
    if (c.plug.delay_hours != null && !(c.plug.delay_hours >= 0)) return 'Plug delay must be a number of hours.';
  }
  return null;
}

/* ---------------- posting slots ---------------- */
function takenTimes(exceptId){ return postsIn('queue').filter(p => p.id !== exceptId).map(p => new Date(p.scheduled_at)); }
function nextSlots(count, taken, from = new Date(Date.now() + 2 * 60e3)){
  const out = [], { days, times } = S.settings.slots;
  if (!days.length || !times.length) return out;
  const sorted = [...times].sort(), d = new Date(from); d.setHours(0, 0, 0, 0);
  for (let i = 0; i < 730 && out.length < count; i++) {
    if (days.includes(d.getDay())) for (const t of sorted) {
      const [h, m] = t.split(':').map(Number), s = new Date(d); s.setHours(h, m, 0, 0);
      if (s < from || taken.some(x => Math.abs(x - s) < 45 * 60e3)) continue;
      out.push(s); taken.push(s); if (out.length >= count) break;
    }
    d.setDate(d.getDate() + 1);
  }
  return out;
}
function jitter(d){
  const j = +S.settings.jitter || 0; if (!j) return d;
  const r = new Date(d.getTime() + Math.round((Math.random() * 2 - 1) * j) * 60e3);
  return r < new Date() ? d : r;
}

/* ---------------- actions ---------------- */
async function scheduleAt(date, label){
  const c = S.cur, err = validate(c, true); if (err) return toast(err, true);
  closePop(); clearTimeout(S.timer);
  await save(c, 'queue', { scheduled_at: iso(date) }, `Schedule ${c.id || 'post'} for ${iso(date)}`);
  S.tab = 'queue'; S.preview = false; renderAll();
  toast(`${label || 'Scheduled'} · ${fmtWhen(date)}`);
}
async function addToQueue(){
  const [slot] = nextSlots(1, takenTimes(S.cur.id));
  if (!slot) return toast('No posting slots set. Add some in Settings.', true);
  await scheduleAt(jitter(slot), 'Added to queue');
}
async function publishNow(){
  const c = S.cur, err = validate(c, true); if (err) return toast(err, true);
  closePop(); clearTimeout(S.timer);
  await save(c, 'queue', { scheduled_at: iso(new Date()) }, `Publish ${c.id || 'post'} now`);
  try { await dispatch('publish'); toast('Publishing now. It should be live within a couple of minutes.'); }
  catch { toast('Queued. It goes out on the next run (within 30 min).\nTip: give your GitHub token “Actions: Read and write” to publish instantly.', false, 7000); }
}
async function moveToDrafts(){ closePop(); await save(S.cur, 'drafts', {}, `Unschedule ${S.cur.id}`); S.tab = 'drafts'; renderAll(); toast('Moved to drafts'); }
async function deletePost(){
  const c = S.cur; if (!c) return;
  if (!c.id) { S.cur = null; renderAll(); return; }
  if (!confirm(c.folder === 'posted' ? 'Remove this from your history? (It stays on LinkedIn.)' : 'Delete this post?')) return;
  const p = S.posts.get(c.id);
  try {
    await (S.chain = S.chain.then(() => commitChanges([{ path: p._path, del: true }, ...(p.media || []).filter(m => m.path).map(m => ({ path: m.path, del: true }))], `Delete ${c.id}`)));

function duplicate(){

async function dropPlug(){

  }

async function fillSrc(el, it){
  if (!el) return;
  try { el.src = it.kind === 'new' ? it.url : it.kind === 'link' ? it.url : await mediaURL(it.path); }
  catch { el.replaceWith(Object.assign(document.createElement('div'), { className: 'note', style: 'padding:16px', textContent: 'Media already cleaned up after posting.' })); }
}
function addFiles(files){
  const c = S.cur; if (!c || readonly() || !files.length) return;
  const typed = files.map(f => ({ f, t: extType(f.name) }));
  if (typed.some(x => !x.t)) return toast('Use JPG, PNG or GIF images, a video, or a PDF/PPT/DOC.', true);
  const types = new Set([...typed.map(x => x.t), ...c.items.map(i => i.type)]);
  if (types.size > 1) return toast('A post can have images, OR one video, OR one document. Remove the current media first.', true);
  const t = [...types][0], total = c.items.length + files.length;
  if (t !== 'image' && total > 1) return toast(`Only one ${t} per post.`, true);
  if (t === 'image' && total > 20) return toast('LinkedIn allows up to 20 images per post.', true);
  const big = files.find(f => f.size > MAX_FILE);
  if (big) return toast(`${big.name} is over 95 MB. Upload it to Dropbox and use the link button instead.`, true);
  for (const f of files) c.items.push({ kind: 'new', file: f, url: URL.createObjectURL(f), type: t, name: f.name, alt: '' });
  if (t === 'document' && !c.media_title) c.media_title = files[0].name.replace(/\.[^.]+$/, '');
  c.mediaChanged = true; renderMedia(); edited();
}
function addLinkMedia(){
  const url = $('#linkInput').value.trim();
  if (!/^https?:\/\//.test(url)) return toast('Paste a link starting with https://', true);
  if (S.cur.items.length) return toast('Remove the current media first.', true);
  S.cur.items.push({ kind: 'link', url, type: 'video', name: 'video', alt: '' });
  S.cur.mediaChanged = true; $('#linkRow').classList.add('hidden'); renderMedia(); edited();
}
function removeItem(i){ const c = S.cur, [it] = c.items.splice(i, 1); if (it.kind === 'repo') c.removed.push(it.path); c.mediaChanged = true; renderMedia(); edited(); }
['#fImages', '#fVideo', '#fDoc'].forEach(sel => $(sel).onchange = e => { addFiles([...e.target.files]); e.target.value = ''; });

  if (files.length) { e.preventDefault(); addFiles(files.map((f, i) => new File([f], f.name && f.name !== 'image.png' ? f.name : `pasted-${Date.now()}-${i}.png`, { type: f.type }))); }

      <input class="field" id="setRepo" placeholder="Repository" value="${esc(cfg.repo || 'linkedin-scheduler')}"></div>
    <div class="grid2"><input class="field" id="setBranch" placeholder="Branch" value="${esc(cfg.branch || 'main')}">
      <input class="field" id="setToken" type="password" placeholder="github_pat_…" value="${esc(cfg.token || '')}"></div>
    <div class="note">Fine-grained token on this repo only: <b>Contents</b> read & write, plus <b>Actions</b> read & write for instant “Publish now” / “Drop plug”.</div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="setSave">Save</button>`);
  const renderTimes = () => { $('#setTimes').innerHTML = st.slots.times.sort().map(t => `<span class="chip">${esc(t)}<button data-rmt="${esc(t)}" title="Remove">${I.x}</button></span>`).join('') || '<span class="note">No times yet</span>';
    o.querySelectorAll('[data-rmt]').forEach(b => b.onclick = () => { st.slots.times = st.slots.times.filter(t => t !== b.dataset.rmt); renderTimes(); }); };
  renderTimes();
  o.querySelectorAll('#setDays .chip').forEach(b => b.onclick = () => { const d = +b.dataset.d; st.slots.days = st.slots.days.includes(d) ? st.slots.days.filter(x => x !== d) : [...st.slots.days, d]; b.classList.toggle('on'); });
  $('#setTimeAdd').onclick = () => { const t = $('#setTime').value; if (t && !st.slots.times.includes(t)) { st.slots.times.push(t); renderTimes(); } };
  $('#setJitter').value = String(st.jitter); $('#setPlugWhen').value = st.plug.delay_hours == null ? 'manual' : String(st.plug.delay_hours);
  $('#setAv').onclick = () => $('#fAvatar').click();
  $('#fAvatar').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; st.profile.avatar = await resizeImage(f, 128); $('#setAv').innerHTML = `<img src="${st.profile.avatar}">`; };
  $('#setSave').onclick = async () => {
    st.profile.name = $('#setName').value.trim(); st.profile.headline = $('#setHeadline').value.trim();
    st.jitter = +$('#setJitter').value; st.plug.text = $('#setPlugText').value; st.plug.link = $('#setPlugLink').value.trim();
    st.plug.delay_hours = $('#setPlugWhen').value === 'manual' ? null : +$('#setPlugWhen').value;
    const ncfg = normalizeCfg({ owner: $('#setOwner').value.trim(), repo: $('#setRepo').value.trim(), branch: $('#setBranch').value.trim() || 'main', token: $('#setToken').value });
    const cfgChanged = JSON.stringify(ncfg) !== JSON.stringify(S.cfg);
    S.cfg = ncfg; store('lis-cfg', ncfg);
    const btn = $('#setSave'); btn.disabled = true; btn.textContent = 'Saving…';
    try {
      if (cfgChanged || !S.connected) await connect();
      const changed = JSON.stringify(st) !== JSON.stringify(S.settings);
      S.settings = st; store('lis-settings', st);
      if (S.connected && changed) await (S.chain = S.chain.then(() => commitChanges([{ path: 'config/settings.json', b64: textToB64(JSON.stringify(st, null, 2) + '\n') }], 'Update settings')));
      closeModal(); renderAll(); toast(S.connected ? 'Connected and saved' : (S.connErr || 'Could not connect to GitHub. Check the connection details.'), !S.connected);
    } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = 'Save'; }
  };
}
function resizeImage(file, size){
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const cv = document.createElement('canvas'); cv.width = cv.height = size; const s = Math.min(img.width, img.height);
    cv.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size); res(cv.toDataURL('image/jpeg', .85)); }; img.onerror = rej; img.src = URL.createObjectURL(file); });
}

/* ---------------- bulk add ---------------- */
let BULK = [];
function openBulk(){
  if (!S.connected) return openSettings();
  const draft = load('lis-bulk') || '';
  const o = modal('Bulk add posts', `
    <div class="note">Paste your posts, separated by a line containing only <code>---</code>. To pin a post to an exact time, start it with a line like <code>@ 2026-12-01 18:00</code>.</div>
    <textarea class="field" id="bText" style="min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px" placeholder="First post…&#10;---&#10;Second post…&#10;---&#10;@ 2026-12-01 18:00&#10;Post with its own time">${esc(draft)}</textarea>
    <div>
      <label class="radio"><input type="radio" name="bMode" value="slots" checked> Fill my next free posting slots</label>
      <label class="radio"><input type="radio" name="bMode" value="drafts"> Save as drafts (schedule later)</label>
      <label class="radio"><input type="checkbox" id="bPlug" ${S.settings.plug.text || S.settings.plug.link ? 'checked' : ''}> Add my default plug comment to each post</label>
    </div>
    <div id="bPreview"></div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn" id="bPrev">Preview</button><button class="btn primary" id="bGo" disabled>Add posts</button>`);
  $('#bText').oninput = () => { store('lis-bulk', $('#bText').value); $('#bGo').disabled = true; };
  o.querySelectorAll('input[name=bMode]').forEach(r => r.onchange = () => $('#bGo').disabled = true);
  $('#bPrev').onclick = bulkPreview;
  $('#bGo').onclick = bulkSubmit;
}
function bulkPreview(){
  const raw = $('#bText').value, mode = document.querySelector('input[name=bMode]:checked').value;
  BULK = raw.split(/^[ \t]*---[ \t]*$/m).map(b => b.trim()).filter(Boolean).map(b => {
    let time = null; const m = b.match(/^@\s*(\d{4}-\d{2}-\d{2})[ T](\d{1,2}):(\d{2})\s*(?:\n|$)/);
    if (m) { time = new Date(`${m[1]}T${m[2].padStart(2, '0')}:${m[3]}`); b = b.slice(m[0].length).trim(); }
    return { text: b, time, files: [] };
  });
  if (!BULK.length) return toast('Paste at least one post.', true);
  if (mode === 'slots') {
    const taken = [...takenTimes(null), ...BULK.filter(p => p.time).map(p => p.time)];
    const slots = nextSlots(BULK.filter(p => !p.time).length, taken);
    if (slots.length < BULK.filter(p => !p.time).length) return toast('Not enough posting slots. Add slot days/times in Settings.', true);
    let i = 0; BULK.forEach(p => { if (!p.time) p.time = jitter(slots[i++]); });
    BULK.sort((a, b) => a.time - b.time);
  }
  $('#bPreview').innerHTML = `<table><thead><tr><th>${mode === 'slots' ? 'When' : '#'}</th><th>Post</th><th>Media</th></tr></thead><tbody>${BULK.map((p, i) => {
    const warn = p.text.length > MAX_TEXT ? `<div class="err">${p.text.length} chars, over 3,000</div>` : (p.time && p.time < new Date() ? `<div class="err">time has passed</div>` : '');
    return `<tr><td style="white-space:nowrap">${mode === 'slots' || p.time ? esc(fmtWhen(p.time)) : i + 1}${warn}</td><td><div class="snip">${esc(p.text)}</div></td>
      <td><input type="file" multiple data-bi="${i}" accept=".jpg,.jpeg,.png,.gif,.mp4,.mov,.m4v,.webm,.pdf,.ppt,.pptx,.doc,.docx"><div class="err" id="be${i}"></div></td></tr>`; }).join('')}</tbody></table>
    <div class="note" style="margin-top:6px">${BULK.length} post${BULK.length > 1 ? 's' : ''}${mode === 'slots' ? `, ${esc(fmtWhen(BULK[0].time))} → ${esc(fmtWhen(BULK[BULK.length - 1].time))}` : ''}</div>`;
  document.querySelectorAll('[data-bi]').forEach(inp => inp.onchange = () => {
    const i = +inp.dataset.bi, files = [...inp.files], t = new Set(files.map(f => extType(f.name)));
    let e = '';
    if (t.has(null)) e = 'Unsupported file'; else if (t.size > 1) e = 'Pick one kind of media';
    else if (files.length > 1 && !t.has('image')) e = 'One video/document only'; else if (files.length > 20) e = 'Max 20 images';
    else if (files.some(f => f.size > MAX_FILE)) e = 'Over 95 MB';
    $('#be' + i).textContent = e; BULK[i].files = e ? [] : files;
  });
  $('#bGo').disabled = BULK.some(p => p.text.length > MAX_TEXT || !p.text);
  $('#bGo').textContent = `Add ${BULK.length} post${BULK.length > 1 ? 's' : ''}`;
}
async function bulkSubmit(){
  const mode = document.querySelector('input[name=bMode]:checked').value, withPlug = $('#bPlug').checked;
  const btn = $('#bGo'); btn.disabled = true;
  try {
    const changes = [];
    for (const [i, b] of BULK.entries()) {
      btn.textContent = `Preparing ${i + 1}/${BULK.length}…`;
      const id = newId() + i, media = [];
      const t = b.files.length ? extType(b.files[0].name) : 'none';
      for (const [k, f] of b.files.entries()) { const path = `media/${id}/${k + 1}-${safeName(f.name)}`; changes.push({ path, b64: await fileToB64(f) }); media.push({ path }); }
      const post = { id, text: b.text, visibility: 'PUBLIC', media_type: t, media, updated_at: iso(new Date()) };
      if (t === 'document') post.media_title = b.files[0].name.replace(/\.[^.]+$/, '');
      if (withPlug) post.plug = { text: S.settings.plug.text, link: S.settings.plug.link, delay_hours: S.settings.plug.delay_hours };
      const folder = mode === 'drafts' && !b.time ? 'drafts' : 'queue';
      if (folder === 'queue') Object.assign(post, { status: 'pending', attempts: 0, error: null, scheduled_at: iso(b.time) }); else post.status = 'draft';
      const path = `${folder}/${id}.json`;
      changes.push({ path, b64: textToB64(JSON.stringify(post, null, 2) + '\n') });
      S.posts.set(id, { ...post, _folder: folder, _path: path });
    }
    btn.textContent = 'Saving to GitHub…';
    await (S.chain = S.chain.then(() => commitChanges(changes, `Bulk add ${BULK.length} posts`)));
    store('lis-bulk', ''); closeModal(); S.tab = mode === 'drafts' ? 'drafts' : 'queue'; renderAll();
    toast(`Added ${BULK.length} post${BULK.length > 1 ? 's' : ''}`);
  } catch (e) { toast('Could not save: ' + e.message, true); btn.disabled = false; btn.textContent = 'Try again'; await loadAll().catch(() => {}); }
}

/* ---------------- wiring ---------------- */
$('#seg').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.tab; store('lis-tab', S.tab); renderSidebar(); };
$('#list').onclick = e => { const b = e.target.closest('.item'); if (b) openPost(b.dataset.id); };
$('#search').oninput = e => { S.search = e.target.value; renderSidebar(); };
$('#newBtn').onclick = newDraft;
$('#bulkBtn').onclick = openBulk;
$('#settingsBtn').onclick = openSettings;
$('#backBtn').onclick = () => { $('#app').classList.remove('post-open'); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePop(); closeModal(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (S.cur && !readonly()) { clearTimeout(S.timer); S.cur.dirty = true; autosave(S.cur); } }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (!typing && !document.querySelector('.overlay') && e.key.toLowerCase() === 'n' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); newDraft(); }
});
window.addEventListener('beforeunload', e => { if (S.cur?.dirty || S.cur?.saving) { e.preventDefault(); e.returnValue = ''; } });
setInterval(() => { if (S.connected && !S.cur?.dirty && !document.hidden) loadAll().catch(() => {}); }, 120000);

(function init(){
  S.cfg = load('lis-cfg') || {};
  // One-click setup link: …/#setup=<base64 JSON>. The part after # never leaves the browser.
  const hm = location.hash.match(/^#setup=(.+)$/);
  if (hm) {
    try { const c = normalizeCfg(JSON.parse(atob(decodeURIComponent(hm[1])))); if (c.owner && c.repo && c.token) { S.cfg = c; store('lis-cfg', c); } } catch {}
    history.replaceState(null, '', location.pathname + location.search);
  }
  const cached = load('lis-settings'); if (cached) S.settings = deepMerge(structuredClone(DEFAULT_SETTINGS), cached);
  S.tab = load('lis-tab') || 'queue';
  renderAll(); connect();
})();
</script>
